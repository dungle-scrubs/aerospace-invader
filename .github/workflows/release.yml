name: Release Binaries

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release --arch ${{ matrix.arch }}

      - name: Create tarball
        run: |
          mkdir -p dist
          cp .build/${{ matrix.arch }}-apple-macosx/release/aerospace-invader dist/
          tar -czvf aerospace-invader-darwin-${{ matrix.arch }}.tar.gz -C dist aerospace-invader

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aerospace-invader-darwin-${{ matrix.arch }}
          path: aerospace-invader-darwin-${{ matrix.arch }}.tar.gz

  attach-binaries:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Calculate SHA256
        id: sha
        run: |
          ARM_SHA=$(shasum -a 256 aerospace-invader-darwin-arm64/aerospace-invader-darwin-arm64.tar.gz | cut -d' ' -f1)
          X86_SHA=$(shasum -a 256 aerospace-invader-darwin-x86_64/aerospace-invader-darwin-x86_64.tar.gz | cut -d' ' -f1)
          echo "arm64_sha=$ARM_SHA" >> $GITHUB_OUTPUT
          echo "x86_64_sha=$X86_SHA" >> $GITHUB_OUTPUT

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          append_body: true
          body: |
            ## Binaries

            **Apple Silicon (M1/M2/M3):**
            ```bash
            curl -L https://github.com/dungle-scrubs/aerospace-invader/releases/latest/download/aerospace-invader-darwin-arm64.tar.gz | tar xz
            mv aerospace-invader /usr/local/bin/
            ```

            **Intel:**
            ```bash
            curl -L https://github.com/dungle-scrubs/aerospace-invader/releases/latest/download/aerospace-invader-darwin-x86_64.tar.gz | tar xz
            mv aerospace-invader /usr/local/bin/
            ```

            ## Checksums

            | Architecture | SHA256 |
            |--------------|--------|
            | arm64 | `${{ steps.sha.outputs.arm64_sha }}` |
            | x86_64 | `${{ steps.sha.outputs.x86_64_sha }}` |
          files: |
            aerospace-invader-darwin-arm64/aerospace-invader-darwin-arm64.tar.gz
            aerospace-invader-darwin-x86_64/aerospace-invader-darwin-x86_64.tar.gz
