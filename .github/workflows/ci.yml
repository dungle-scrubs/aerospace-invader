name: CI
on:
  pull_request:
    branches: [main]

# Cost control: cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the checkout.
permissions:
  contents: read

jobs:
  build:
    # Swift build/test/lint of a macOS target: runs on the self-hosted runner on mini (ticket #18)
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Lint
        run: |
          brew install swiftlint swift-format
          swiftlint lint --strict
          swift-format lint -r Sources Tests
