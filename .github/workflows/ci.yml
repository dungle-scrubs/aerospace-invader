name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cost control: cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the checkout. The secrets-scan job below grants
# itself nothing extra — gitleaks scans the working tree with read-only access.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
